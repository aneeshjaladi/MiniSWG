apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniswg-deployment
  labels:
    app: miniswg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniswg
  template:
    metadata:
      labels:
        app: miniswg
    spec:
      containers:
      - name: miniswg
        image: miniswg:latest
        imagePullPolicy: Never
        command: ["python", "-m", "miniswg.proxy"]
        args:
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
          - "--policy"
          - "config/policy.json"
          - "--no-rate-limit"
          - "--quiet"
        ports:
        - containerPort: 8080
          name: proxy
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: miniswg-service
  labels:
    app: miniswg
spec:
  type: NodePort
  selector:
    app: miniswg
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http-proxy
