apiVersion: apps/v1
kind: Deployment
metadata:
  name: origin-deployment
  labels:
    app: origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin
    spec:
      containers:
      - name: origin
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /usr/share/nginx/html
            head -c 1024 /dev/urandom | base64 | head -c 1024 > /usr/share/nginx/html/index.html
            cat << 'EOF' > /etc/nginx/conf.d/default.conf
            server {
                listen 8000;
                access_log off;
                location / {
                    root /usr/share/nginx/html;
                    index index.html;
                }
            }
            EOF
            exec nginx -g "daemon off;"
        ports:
        - containerPort: 8000
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: origin-service
  labels:
    app: origin
spec:
  type: ClusterIP
  selector:
    app: origin
  ports:
  - port: 8000
    targetPort: 8000
    name: http
